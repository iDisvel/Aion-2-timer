<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AION II — Countdown</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        :root {
            --purple: #987cff;
            --violet: #633cff;
            --blue: #5da9ff;

            --gold: #d9b45a;
            --gold-light: #ffe7a0;
            --gold-bright: #fff1bd;
            --gold-dark: #80651f;

            --white: #f8f5ff;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            font-family: 'Cinzel', serif;
            color: var(--white);

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    ellipse at 50% 45%,
                    rgba(105, 70, 220, .30) 0%,
                    rgba(44, 29, 100, .17) 25%,
                    transparent 55%
                ),

                radial-gradient(
                    ellipse at 50% 100%,
                    rgba(180, 135, 45, .10),
                    transparent 45%
                ),

                linear-gradient(
                    180deg,
                    #02030b 0%,
                    #080817 48%,
                    #03040b 100%
                );
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }


        /* Центральная аура */

        .aura {
            position: absolute;

            width: 100vmin;
            height: 100vmin;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(116, 75, 255, .22) 0%,
                    rgba(90, 52, 190, .10) 27%,
                    rgba(205, 165, 65, .035) 42%,
                    transparent 67%
                );

            filter: blur(12px);

            animation: auraPulse 6s ease-in-out infinite;
        }


        @keyframes auraPulse {

            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(.9);

                opacity: .55;
            }

            50% {
                transform:
                    translate(-50%, -50%)
                    scale(1.1);

                opacity: 1;
            }
        }


        /* =====================================================
           LIGHT RAYS
        ===================================================== */

        .rays {
            position: absolute;

            width: 140vmax;
            height: 140vmax;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background:
                conic-gradient(
                    from 0deg,

                    transparent 0deg,

                    rgba(137, 101, 255, .045) 12deg,

                    transparent 25deg,

                    transparent 45deg,

                    rgba(230, 192, 92, .025) 57deg,

                    transparent 72deg,

                    transparent 110deg,

                    rgba(147, 100, 255, .04) 125deg,

                    transparent 140deg,

                    transparent 200deg,

                    rgba(222, 184, 83, .025) 218deg,

                    transparent 240deg,

                    transparent 360deg
                );

            animation:
                rotateRays 45s linear infinite;
        }


        @keyframes rotateRays {

            to {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg);
            }
        }


        /* =====================================================
           STARS
        ===================================================== */

        .stars {
            position: absolute;
            inset: 0;

            background-image:

                radial-gradient(
                    1px 1px at 5% 12%,
                    #fff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 12% 72%,
                    #9e8cff,
                    transparent
                ),

                radial-gradient(
                    2px 2px at 18% 33%,
                    #fff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 27% 12%,
                    #e8c969,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 33% 82%,
                    #fff,
                    transparent
                ),

                radial-gradient(
                    2px 2px at 42% 24%,
                    #a88cff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 49% 88%,
                    #ffe7a0,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 58% 13%,
                    #a88cff,
                    transparent
                ),

                radial-gradient(
                    2px 2px at 67% 31%,
                    #fff,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 74% 77%,
                    #d8b85f,
                    transparent
                ),

                radial-gradient(
                    1px 1px at 83% 18%,
                    #fff,
                    transparent
                ),

                radial-gradient(
                    2px 2px at 92% 64%,
                    #9f8aff,
                    transparent
                );

            opacity: .7;

            animation:
                starsMove 8s ease-in-out infinite alternate;
        }


        @keyframes starsMove {

            from {
                opacity: .35;
            }

            to {
                opacity: .9;
            }
        }


        /* =====================================================
           PARTICLES
        ===================================================== */

        .particles {
            position: absolute;
            inset: 0;
        }


        .particle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background:
                linear-gradient(
                    45deg,
                    var(--gold-light),
                    var(--purple)
                );

            box-shadow:
                0 0 8px var(--gold),
                0 0 18px var(--violet);

            animation:
                floatParticle linear infinite;
        }


        .particle:nth-child(1) {
            left: 12%;
            top: 70%;
            animation-duration: 9s;
        }

        .particle:nth-child(2) {
            left: 20%;
            top: 45%;
            animation-duration: 13s;
        }

        .particle:nth-child(3) {
            left: 29%;
            top: 80%;
            animation-duration: 11s;
        }

        .particle:nth-child(4) {
            left: 39%;
            top: 70%;
            animation-duration: 8s;
        }

        .particle:nth-child(5) {
            left: 61%;
            top: 80%;
            animation-duration: 12s;
        }

        .particle:nth-child(6) {
            left: 70%;
            top: 48%;
            animation-duration: 10s;
        }

        .particle:nth-child(7) {
            left: 79%;
            top: 70%;
            animation-duration: 14s;
        }

        .particle:nth-child(8) {
            left: 90%;
            top: 40%;
            animation-duration: 9s;
        }


        @keyframes floatParticle {

            0% {
                transform:
                    translateY(80px)
                    scale(.4);

                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: .8;
            }

            100% {
                transform:
                    translateY(-220px)
                    scale(1.2);

                opacity: 0;
            }
        }


        /* =====================================================
           MAGIC RING
        ===================================================== */

        .magic-ring {
            position: absolute;

            width: min(620px, 75vw);
            height: min(620px, 75vw);

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            border:
                1px solid
                rgba(163, 127, 255, .18);

            box-shadow:

                0 0 60px
                rgba(99, 63, 255, .08),

                0 0 100px
                rgba(220, 175, 70, .035),

                inset 0 0 60px
                rgba(90, 70, 255, .04);

            animation:
                ringPulse 5s ease-in-out infinite;
        }


        .magic-ring::before {
            content: "";

            position: absolute;

            inset: 35px;

            border-radius: 50%;

            border:
                1px dashed
                rgba(137, 108, 255, .25);

            animation:
                spinReverse 30s linear infinite;
        }


        .magic-ring::after {
            content:
                "✦  ◇  ✦  ◇  ✦  ◇  ✦  ◇";

            position: absolute;

            inset: 75px;

            border-radius: 50%;

            display: flex;

            align-items: flex-start;
            justify-content: center;

            color:
                rgba(222, 186, 91, .42);

            font-size: 16px;

            letter-spacing: 13px;

            animation:
                spin 35s linear infinite;
        }


        @keyframes ringPulse {

            0%,
            100% {
                opacity: .45;
            }

            50% {
                opacity: .9;
            }
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        @keyframes spinReverse {

            to {
                transform: rotate(-360deg);
            }
        }


        /* =====================================================
           SIDE DECORATION
           Вместо силуэтов и крыльев
        ===================================================== */

        .side-decoration {
            position: fixed;

            top: 50%;
            transform: translateY(-50%);

            width: 150px;
            height: 430px;

            z-index: 3;

            opacity: .42;

            pointer-events: none;
        }


        .side-decoration.left {
            left: 0;
        }


        .side-decoration.right {
            right: 0;

            transform:
                translateY(-50%)
                scaleX(-1);
        }


        /* Основная светящаяся линия */

        .side-decoration::before {
            content: "";

            position: absolute;

            top: 10%;
            bottom: 10%;

            left: 50%;

            width: 1px;

            background:
                linear-gradient(
                    180deg,
                    transparent,
                    rgba(217, 180, 90, .05) 10%,
                    rgba(217, 180, 90, .55) 35%,
                    rgba(152, 124, 255, .7) 50%,
                    rgba(217, 180, 90, .35) 70%,
                    transparent
                );

            box-shadow:
                0 0 12px rgba(152, 124, 255, .35),
                0 0 25px rgba(217, 180, 90, .15);
        }


        /* Рунические точки */

        .side-decoration::after {
            content:
                "✦\A\A◇\A\A✧\A\A◇\A\A✦";

            white-space: pre;

            position: absolute;

            left: 50%;

            top: 8%;

            transform: translateX(-50%);

            color:
                rgba(222, 186, 91, .65);

            font-family:
                'Cinzel',
                serif;

            font-size: 13px;

            line-height: 1.5;

            text-shadow:
                0 0 8px rgba(152, 124, 255, .65),
                0 0 15px rgba(217, 180, 90, .25);
        }


        /* =====================================================
           MAIN PANEL
        ===================================================== */

        .container {
            position: relative;

            z-index: 10;

            width: min(960px, 92vw);

            padding:
                55px 45px 45px;

            text-align: center;

            background:

                linear-gradient(
                    145deg,
                    rgba(13, 12, 32, .90),
                    rgba(4, 6, 17, .80)
                );

            border:
                1px solid
                rgba(169, 135, 255, .40);

            box-shadow:

                0 0 80px
                rgba(81, 48, 190, .20),

                0 0 130px
                rgba(194, 151, 48, .035),

                inset 0 0 80px
                rgba(79, 53, 170, .06);

            backdrop-filter: blur(10px);

            clip-path:
                polygon(
                    0 30px,
                    30px 0,
                    calc(100% - 30px) 0,
                    100% 30px,
                    100% calc(100% - 30px),
                    calc(100% - 30px) 100%,
                    30px 100%,
                    0 calc(100% - 30px)
                );
        }


        /* Внутренняя рамка */

        .container::before {
            content: "";

            position: absolute;

            inset: 12px;

            border:
                1px solid
                rgba(210, 175, 80, .16);

            pointer-events: none;
        }


        /* =====================================================
           CORNERS
        ===================================================== */

        .corner {
            position: absolute;

            width: 55px;
            height: 55px;

            border-style: solid;
        }


        .corner.tl {
            top: 10px;
            left: 10px;

            border-width:
                1px 0 0 1px;

            border-color:
                var(--gold);
        }


        .corner.tr {
            top: 10px;
            right: 10px;

            border-width:
                1px 1px 0 0;

            border-color:
                var(--gold);
        }


        .corner.bl {
            bottom: 10px;
            left: 10px;

            border-width:
                0 0 1px 1px;

            border-color:
                rgba(137, 110, 255, .7);
        }


        .corner.br {
            bottom: 10px;
            right: 10px;

            border-width:
                0 1px 1px 0;

            border-color:
                rgba(137, 110, 255, .7);
        }


        /* =====================================================
           TITLE
        ===================================================== */

        h1 {
            margin: 0;

            font-size:
                clamp(52px, 9vw, 96px);

            line-height: 1;

            font-weight: 600;

            letter-spacing: 9px;

            background:

                linear-gradient(
                    180deg,

                    #fff 0%,

                    #eee8ff 35%,

                    #d2b86a 62%,

                    #9b7730 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(135, 102, 255, .35)
                );
        }


        .separator {
            width:
                min(430px, 65%);

            height: 1px;

            margin:
                28px auto 25px;

            background:

                linear-gradient(
                    90deg,

                    transparent,

                    #7658db 20%,

                    var(--gold) 50%,

                    #7658db 80%,

                    transparent
                );

            box-shadow:

                0 0 12px
                rgba(211, 169, 66, .45);
        }


        .launch {
            font-size: 13px;

            letter-spacing: 5px;

            color:
                #b9b1d1;

            text-transform: uppercase;

            margin-bottom: 17px;
        }


        /* =====================================================
           TIMER
        ===================================================== */

        #timer {
            font-family:
                'Orbitron',
                sans-serif;

            font-size:
                clamp(48px, 10vw, 94px);

            line-height: 1;

            font-weight: 500;

            letter-spacing: 5px;

            background:

                linear-gradient(
                    180deg,

                    #ffffff 0%,

                    #f4eeff 38%,

                    #e7d78d 75%,

                    #c29c3d 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 7px
                rgba(220, 209, 255, .9);

            filter:

                drop-shadow(
                    0 0 10px
                    rgba(151, 117, 255, .75)
                )

                drop-shadow(
                    0 0 30px
                    rgba(197, 157, 57, .25)
                );

            margin:
                5px 0 24px;
        }


        /* =====================================================
           TIME LABELS
        ===================================================== */

        .time-labels {
            display: flex;

            justify-content: center;

            gap:
                clamp(30px, 8vw, 90px);

            font-family:
                'Orbitron',
                sans-serif;

            font-size: 8px;

            letter-spacing: 2px;

            color:
                #716984;

            text-transform: none;
        }


        /* =====================================================
           LOCAL TIME
        ===================================================== */

        .local-time {
            margin-top: 30px;

            font-size: 10px;

            letter-spacing: 2px;

            color:
                #77708c;
        }


        /* =====================================================
           BOTTOM LIGHT
        ===================================================== */

        .bottom-glow {
            position: fixed;

            left: 50%;
            bottom: -180px;

            width: 900px;
            height: 350px;

            transform:
                translateX(-50%);

            border-radius: 50%;

            background:

                radial-gradient(
                    ellipse,

                    rgba(89, 58, 220, .25),

                    rgba(206, 163, 57, .07)
                    35%,

                    transparent 70%
                );

            filter: blur(30px);

            pointer-events: none;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .container {
                width: 94vw;

                padding:
                    42px 18px 38px;
            }


            .side-decoration {
                opacity: .18;

                transform:
                    translateY(-50%)
                    scale(.7);
            }


            .side-decoration.right {
                transform:
                    translateY(-50%)
                    scaleX(-1)
                    scale(.7);
            }


            h1 {
                letter-spacing: 4px;
            }


            #timer {
                letter-spacing: 2px;
            }


            .launch {
                letter-spacing: 3px;
            }


            .time-labels {
                gap: 25px;

                font-size: 7px;

                letter-spacing: 1px;
            }


            .magic-ring {
                width: 105vw;
                height: 105vw;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background">

        <div class="aura"></div>

        <div class="rays"></div>

        <div class="stars"></div>

        <div class="particles">

            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>

            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>

        </div>

        <div class="magic-ring"></div>

    </div>


    <!-- =====================================================
         SIDE DECORATION
    ====================================================== -->

    <div class="side-decoration left"></div>

    <div class="side-decoration right"></div>


    <!-- =====================================================
         MAIN PANEL
    ====================================================== -->

    <main class="container">

        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>


        <h1>AION II</h1>


        <div class="separator"></div>


        <div class="launch">
            До открытия серверов
        </div>


        <div id="timer">
            00:00:00
        </div>


        <div class="time-labels">

            <span>Часы</span>

            <span>Минуты</span>

            <span>Секунды</span>

        </div>


        <div class="local-time">
            Завтра • 16:00 • локальное время устройства
        </div>

    </main>


    <div class="bottom-glow"></div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /*
         * ==========================================
         * ВРЕМЯ ЗАПУСКА
         * ==========================================
         *
         * Завтра в 16:00
         * по локальному времени устройства.
         */

        const targetDate = new Date();


        targetDate.setDate(
            targetDate.getDate() + 1
        );


        targetDate.setHours(
            16,
            0,
            0,
            0
        );


        /*
         * Элемент таймера
         */

        const timer =
            document.getElementById("timer");


        /*
         * Форматирование:
         *
         * 7 → 07
         */

        function pad(number) {

            return String(number)
                .padStart(2, "0");

        }


        /*
         * ==========================================
         * ОБНОВЛЕНИЕ
         * ==========================================
         */

        function updateTimer() {

            const now =
                new Date();


            const distance =
                targetDate.getTime()
                -
                now.getTime();


            /*
             * Сервер уже открылся
             */

            if (distance <= 0) {

                timer.textContent =
                    "00:00:00";

                document
                    .querySelector(".launch")
                    .textContent =
                    "Серверы открыты";

                return;
            }


            /*
             * Часы
             */

            const hours =
                Math.floor(
                    distance /
                    (1000 * 60 * 60)
                );


            /*
             * Минуты
             */

            const minutes =
                Math.floor(
                    (
                        distance %
                        (1000 * 60 * 60)
                    )
                    /
                    (1000 * 60)
                );


            /*
             * Секунды
             */

            const seconds =
                Math.floor(
                    (
                        distance %
                        (1000 * 60)
                    )
                    /
                    1000
                );


            /*
             * Вывод
             */

            timer.textContent =
                `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;

        }


        /*
         * Первый запуск
         */

        updateTimer();


        /*
         * Обновляем каждую секунду
         */

        setInterval(
            updateTimer,
            1000
        );

    </script>

</body>
</html>
