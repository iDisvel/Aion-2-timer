<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AION II — Server Countdown</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        :root {
            --purple: #9b7cff;
            --violet: #6d45ff;
            --blue: #5aa9ff;
            --white: #f7f4ff;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            font-family: 'Cinzel', serif;
            color: var(--white);

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    ellipse at 50% 48%,
                    rgba(89, 58, 190, .28) 0%,
                    rgba(37, 25, 83, .18) 22%,
                    transparent 52%
                ),
                radial-gradient(
                    ellipse at 50% 100%,
                    rgba(27, 78, 140, .20),
                    transparent 55%
                ),
                linear-gradient(
                    180deg,
                    #02030b 0%,
                    #070817 48%,
                    #02030a 100%
                );
        }

        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* Огромное магическое свечение */

        .aura {
            position: absolute;

            width: 100vmin;
            height: 100vmin;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(120, 79, 255, .18) 0%,
                    rgba(80, 45, 180, .10) 25%,
                    transparent 65%
                );

            filter: blur(10px);

            animation: auraPulse 6s ease-in-out infinite;
        }

        @keyframes auraPulse {
            0%, 100% {
                transform: translate(-50%, -50%) scale(.9);
                opacity: .55;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.1);
                opacity: 1;
            }
        }

        /* Лучи */

        .rays {
            position: absolute;
            width: 140vmax;
            height: 140vmax;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            background:
                conic-gradient(
                    from 0deg,
                    transparent 0deg,
                    rgba(132, 97, 255, .035) 12deg,
                    transparent 25deg,
                    transparent 47deg,
                    rgba(90, 150, 255, .035) 59deg,
                    transparent 72deg,
                    transparent 110deg,
                    rgba(147, 100, 255, .04) 125deg,
                    transparent 140deg,
                    transparent 200deg,
                    rgba(100, 90, 255, .035) 220deg,
                    transparent 240deg,
                    transparent 360deg
                );

            animation: rotateRays 45s linear infinite;
        }

        @keyframes rotateRays {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* Звёзды */

        .stars {
            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(1px 1px at 5% 12%, #fff, transparent),
                radial-gradient(1px 1px at 12% 72%, #9e8cff, transparent),
                radial-gradient(2px 2px at 18% 33%, #fff, transparent),
                radial-gradient(1px 1px at 27% 12%, #a88cff, transparent),
                radial-gradient(1px 1px at 33% 82%, #fff, transparent),
                radial-gradient(2px 2px at 42% 24%, #a88cff, transparent),
                radial-gradient(1px 1px at 49% 88%, #fff, transparent),
                radial-gradient(1px 1px at 58% 13%, #a88cff, transparent),
                radial-gradient(2px 2px at 67% 31%, #fff, transparent),
                radial-gradient(1px 1px at 74% 77%, #a88cff, transparent),
                radial-gradient(1px 1px at 83% 18%, #fff, transparent),
                radial-gradient(2px 2px at 92% 64%, #9f8aff, transparent);

            opacity: .65;

            animation: starsMove 8s ease-in-out infinite alternate;
        }

        @keyframes starsMove {
            from {
                opacity: .35;
            }

            to {
                opacity: .9;
            }
        }

        /* =====================================================
           FLOATING PARTICLES
        ===================================================== */

        .particles {
            position: absolute;
            inset: 0;
        }

        .particle {
            position: absolute;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #bba9ff;

            box-shadow:
                0 0 8px #896dff,
                0 0 18px #6240ff;

            animation: floatParticle linear infinite;
        }

        .particle:nth-child(1) {
            left: 12%;
            top: 70%;
            animation-duration: 9s;
        }

        .particle:nth-child(2) {
            left: 20%;
            top: 45%;
            animation-duration: 13s;
        }

        .particle:nth-child(3) {
            left: 29%;
            top: 80%;
            animation-duration: 11s;
        }

        .particle:nth-child(4) {
            left: 39%;
            top: 70%;
            animation-duration: 8s;
        }

        .particle:nth-child(5) {
            left: 61%;
            top: 80%;
            animation-duration: 12s;
        }

        .particle:nth-child(6) {
            left: 70%;
            top: 48%;
            animation-duration: 10s;
        }

        .particle:nth-child(7) {
            left: 79%;
            top: 70%;
            animation-duration: 14s;
        }

        .particle:nth-child(8) {
            left: 90%;
            top: 40%;
            animation-duration: 9s;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(80px) scale(.4);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: .8;
            }

            100% {
                transform: translateY(-220px) scale(1.2);
                opacity: 0;
            }
        }

        /* =====================================================
           CENTRAL MAGIC RING
        ===================================================== */

        .magic-ring {
            position: absolute;

            width: min(620px, 75vw);
            height: min(620px, 75vw);

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            border:
                1px solid rgba(143, 111, 255, .16);

            box-shadow:
                0 0 60px rgba(99, 63, 255, .08),
                inset 0 0 60px rgba(90, 70, 255, .04);

            animation: ringPulse 5s ease-in-out infinite;
        }

        .magic-ring::before {
            content: "";

            position: absolute;
            inset: 35px;

            border-radius: 50%;

            border:
                1px dashed rgba(137, 108, 255, .23);

            animation: spinReverse 30s linear infinite;
        }

        .magic-ring::after {
            content: "✦  ◇  ✦  ◇  ✦  ◇  ✦  ◇";

            position: absolute;

            inset: 75px;

            border-radius: 50%;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            padding-top: 0;

            color: rgba(171, 145, 255, .35);

            font-size: 16px;
            letter-spacing: 13px;

            animation: spin 35s linear infinite;
        }

        @keyframes ringPulse {
            0%, 100% {
                opacity: .45;
            }

            50% {
                opacity: .9;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes spinReverse {
            to {
                transform: rotate(-360deg);
            }
        }

        /* =====================================================
           MAIN CARD
        ===================================================== */

        .container {
            position: relative;

            z-index: 10;

            width: min(960px, 92vw);

            padding: 52px 45px 45px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(12, 11, 31, .88),
                    rgba(4, 6, 17, .79)
                );

            border:
                1px solid rgba(150, 123, 255, .38);

            box-shadow:
                0 0 80px rgba(81, 48, 190, .20),
                inset 0 0 80px rgba(79, 53, 170, .06);

            backdrop-filter: blur(10px);

            clip-path: polygon(
                0 30px,
                30px 0,
                calc(100% - 30px) 0,
                100% 30px,
                100% calc(100% - 30px),
                calc(100% - 30px) 100%,
                30px 100%,
                0 calc(100% - 30px)
            );
        }

        /* Рамка */

        .container::before {
            content: "";

            position: absolute;
            inset: 12px;

            border:
                1px solid rgba(146, 116, 255, .12);

            pointer-events: none;
        }

        /* Углы */

        .corner {
            position: absolute;

            width: 55px;
            height: 55px;

            border-color: rgba(174, 148, 255, .7);
            border-style: solid;
        }

        .corner.tl {
            top: 10px;
            left: 10px;

            border-width: 1px 0 0 1px;
        }

        .corner.tr {
            top: 10px;
            right: 10px;

            border-width: 1px 1px 0 0;
        }

        .corner.bl {
            bottom: 10px;
            left: 10px;

            border-width: 0 0 1px 1px;
        }

        .corner.br {
            bottom: 10px;
            right: 10px;

            border-width: 0 1px 1px 0;
        }

        /* =====================================================
           TEXT
        ===================================================== */

        .eyebrow {
            position: relative;

            font-family: 'Orbitron', sans-serif;

            font-size: 10px;
            letter-spacing: 7px;

            color: #8e7ad8;

            text-transform: uppercase;

            margin-bottom: 16px;

            text-shadow:
                0 0 12px rgba(126, 90, 255, .8);
        }

        h1 {
            position: relative;

            margin: 0;

            font-size: clamp(52px, 9vw, 96px);

            line-height: 1;

            font-weight: 600;

            letter-spacing: 9px;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #e7e0ff 38%,
                    #b19aff 70%,
                    #7354d6 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            filter:
                drop-shadow(0 0 12px rgba(135, 102, 255, .35));
        }

        .separator {
            width: min(430px, 65%);

            height: 1px;

            margin: 28px auto 25px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #8468ed 25%,
                    #d2c6ff 50%,
                    #8468ed 75%,
                    transparent
                );

            box-shadow:
                0 0 12px rgba(122, 90, 255, .8);
        }

        .launch {
            font-size: 13px;

            letter-spacing: 5px;

            color: #aaa3c7;

            text-transform: uppercase;

            margin-bottom: 17px;
        }

        /* =====================================================
           TIMER
        ===================================================== */

        #timer {
            font-family: 'Orbitron', sans-serif;

            font-size: clamp(48px, 10vw, 94px);

            line-height: 1;

            font-weight: 500;

            letter-spacing: 5px;

            color: #f8f5ff;

            text-shadow:
                0 0 7px rgba(220, 209, 255, .9),
                0 0 18px rgba(151, 117, 255, .8),
                0 0 40px rgba(102, 66, 255, .55),
                0 0 80px rgba(75, 40, 255, .25);

            margin: 5px 0 24px;
        }

        .time-labels {
            display: flex;

            justify-content: center;

            gap: clamp(30px, 8vw, 90px);

            font-family: 'Orbitron', sans-serif;

            font-size: 8px;

            letter-spacing: 4px;

            color: #625b7d;

            text-transform: uppercase;
        }

        /* =====================================================
           STATUS
        ===================================================== */

        .status {
            display: inline-flex;

            align-items: center;

            gap: 9px;

            margin-top: 30px;

            padding: 8px 17px;

            border:
                1px solid rgba(123, 94, 224, .25);

            background:
                rgba(86, 58, 180, .08);

            color: #8076a3;

            font-family: 'Orbitron', sans-serif;

            font-size: 8px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        .status-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #9c83ff;

            box-shadow:
                0 0 8px #8968ff,
                0 0 15px #6440ff;

            animation: statusPulse 1.5s infinite;
        }

        @keyframes statusPulse {
            0%, 100% {
                opacity: .35;
                transform: scale(.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .local-time {
            margin-top: 18px;

            font-size: 10px;

            letter-spacing: 2px;

            color: #57516d;
        }

        /* =====================================================
           SIDE FIGURES
        ===================================================== */

        .figure {
            position: fixed;

            bottom: -30px;

            width: 260px;
            height: 620px;

            z-index: 3;

            opacity: .35;

            pointer-events: none;

            filter:
                drop-shadow(0 0 30px rgba(99, 65, 255, .18));
        }

        .figure.left {
            left: -25px;
            transform: scaleX(-1);
        }

        .figure.right {
            right: -25px;
        }

        /*
            Абстрактный силуэт персонажа.
            Сделан CSS-формами, чтобы файл оставался автономным.
        */

        .figure::before {
            content: "";

            position: absolute;

            left: 90px;
            top: 85px;

            width: 90px;
            height: 110px;

            border-radius: 50% 50% 45% 45%;

            background:
                radial-gradient(
                    ellipse,
                    rgba(152, 124, 255, .35),
                    rgba(23, 18, 51, .7) 60%,
                    transparent 72%
                );

            filter: blur(2px);
        }

        .figure::after {
            content: "";

            position: absolute;

            left: 40px;
            top: 160px;

            width: 200px;
            height: 390px;

            background:
                linear-gradient(
                    160deg,
                    transparent 0 20%,
                    rgba(55, 43, 105, .65) 40%,
                    rgba(13, 11, 30, .95) 65%,
                    transparent 90%
                );

            clip-path: polygon(
                45% 0,
                68% 8%,
                82% 30%,
                100% 55%,
                78% 52%,
                91% 100%,
                55% 82%,
                36% 100%,
                40% 58%,
                0 72%,
                22% 42%,
                10% 20%
            );
        }

        /* Крыло */

        .wing {
            position: absolute;

            top: 120px;

            width: 260px;
            height: 270px;

            background:
                radial-gradient(
                    ellipse at 50% 70%,
                    rgba(119, 91, 220, .3),
                    transparent 65%
                );

            clip-path: polygon(
                50% 100%,
                42% 78%,
                25% 60%,
                0 45%,
                20% 43%,
                5% 25%,
                33% 35%,
                22% 8%,
                48% 30%,
                55% 0,
                62% 30%,
                86% 10%,
                76% 38%,
                100% 28%,
                78% 55%,
                65% 75%
            );

            filter:
                drop-shadow(0 0 20px rgba(112, 79, 255, .25));
        }

        .figure.left .wing {
            right: -20px;
        }

        .figure.right .wing {
            left: -20px;
        }

        /* =====================================================
           BOTTOM GLOW
        ===================================================== */

        .bottom-glow {
            position: fixed;

            left: 50%;
            bottom: -180px;

            width: 900px;
            height: 350px;

            transform: translateX(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    ellipse,
                    rgba(88, 57, 220, .25),
                    transparent 70%
                );

            filter: blur(30px);

            pointer-events: none;
        }

        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .container {
                width: 94vw;
                padding: 42px 18px 38px;
            }

            .figure {
                opacity: .12;
                transform: scale(.7);
            }

            .figure.left {
                left: -120px;
            }

            .figure.right {
                right: -120px;
            }

            h1 {
                letter-spacing: 4px;
            }

            #timer {
                letter-spacing: 2px;
            }

            .launch {
                letter-spacing: 3px;
            }

            .time-labels {
                gap: 25px;
            }

            .magic-ring {
                width: 105vw;
                height: 105vw;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background">

        <div class="aura"></div>
        <div class="rays"></div>
        <div class="stars"></div>

        <div class="particles">
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
            <span class="particle"></span>
        </div>

        <div class="magic-ring"></div>

    </div>


    <!-- =====================================================
         SIDE FIGURES
    ====================================================== -->

    <div class="figure left">
        <div class="wing"></div>
    </div>

    <div class="figure right">
        <div class="wing"></div>
    </div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="container">

        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="eyebrow">
            Ascension Protocol
        </div>

        <h1>AION II</h1>

        <div class="separator"></div>

        <div class="launch">
            До открытия серверов
        </div>

        <div id="timer">
            00:00:00
        </div>

        <div class="time-labels">
            <span>Hours</span>
            <span>Minutes</span>
            <span>Seconds</span>
        </div>

        <div class="status">
            <span class="status-dot"></span>
            Server synchronization
        </div>

        <div class="local-time">
            Завтра • 16:00 • локальное время устройства
        </div>

    </main>


    <div class="bottom-glow"></div>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /*
         * ==========================================
         * НАСТРОЙКА ВРЕМЕНИ ЗАПУСКА
         * ==========================================
         *
         * Сейчас установлено:
         *
         * ЗАВТРА В 16:00
         *
         * по локальному времени устройства.
         */

        const targetDate = new Date();

        targetDate.setDate(
            targetDate.getDate() + 1
        );

        targetDate.setHours(
            16,
            0,
            0,
            0
        );


        /*
         * ==========================================
         * ЭЛЕМЕНТЫ
         * ==========================================
         */

        const timer = document.getElementById("timer");
        const launchText = document.querySelector(".launch");
        const status = document.querySelector(".status");


        /*
         * Форматирование чисел:
         *
         * 5 → 05
         */

        function pad(number) {
            return String(number).padStart(2, "0");
        }


        /*
         * ==========================================
         * ОБНОВЛЕНИЕ ТАЙМЕРА
         * ==========================================
         */

        function updateTimer() {

            const now = new Date();

            const distance =
                targetDate.getTime() -
                now.getTime();


            /*
             * Если время запуска наступило
             */

            if (distance <= 0) {

                timer.textContent = "00:00:00";

                launchText.textContent =
                    "Серверы открыты";

                status.innerHTML = `
                    <span class="status-dot"></span>
                    World is now accessible
                `;

                return;
            }


            /*
             * Считаем часы.
             *
             * В отличие от стандартного варианта
             * здесь часы НЕ сбрасываются после 24.
             *
             * Например:
             *
             * 27:15:42
             */

            const hours = Math.floor(
                distance /
                (1000 * 60 * 60)
            );


            const minutes = Math.floor(
                (distance %
                    (1000 * 60 * 60)) /
                (1000 * 60)
            );


            const seconds = Math.floor(
                (distance %
                    (1000 * 60)) /
                1000
            );


            /*
             * Вывод
             */

            timer.textContent =
                `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }


        /*
         * Первый запуск
         */

        updateTimer();


        /*
         * Обновляем каждую секунду
         */

        setInterval(
            updateTimer,
            1000
        );

    </script>

</body>
</html>
