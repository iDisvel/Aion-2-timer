<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AION 2 — Countdown</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Cinzel', serif;
            color: #fff;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 40%,
                    rgba(91, 68, 180, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(0, 120, 255, 0.12),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #050612 0%,
                    #0b0a1c 45%,
                    #060711 100%
                );
        }

        /* Фоновое свечение */

        body::before {
            content: "";
            position: fixed;
            inset: -50%;

            background:
                radial-gradient(
                    circle,
                    rgba(139, 92, 246, 0.08) 0%,
                    transparent 45%
                );

            animation: aura 8s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes aura {
            from {
                transform: scale(0.9);
                opacity: 0.5;
            }

            to {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        /* Основная панель */

        .container {
            position: relative;
            width: min(900px, 92%);
            padding: 55px 45px 50px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(23, 20, 51, 0.92),
                    rgba(8, 9, 22, 0.95)
                );

            border: 1px solid rgba(157, 126, 255, 0.35);

            box-shadow:
                0 0 80px rgba(100, 70, 220, 0.15),
                inset 0 0 50px rgba(100, 70, 220, 0.04);

            backdrop-filter: blur(12px);

            clip-path: polygon(
                0 25px,
                25px 0,
                calc(100% - 25px) 0,
                100% 25px,
                100% calc(100% - 25px),
                calc(100% - 25px) 100%,
                25px 100%,
                0 calc(100% - 25px)
            );
        }

        /* Декоративная рамка */

        .container::before,
        .container::after {
            content: "";
            position: absolute;
            width: 70px;
            height: 70px;

            border-color: rgba(170, 140, 255, 0.65);
            border-style: solid;

            pointer-events: none;
        }

        .container::before {
            top: 12px;
            left: 12px;

            border-width: 1px 0 0 1px;
        }

        .container::after {
            right: 12px;
            bottom: 12px;

            border-width: 0 1px 1px 0;
        }

        /* Верхняя подпись */

        .subtitle {
            font-family: 'Orbitron', sans-serif;

            font-size: 12px;
            letter-spacing: 6px;

            color: #9d8cff;

            text-transform: uppercase;

            margin-bottom: 18px;

            text-shadow:
                0 0 12px rgba(130, 100, 255, 0.8);
        }

        /* Заголовок */

        h1 {
            margin: 0;

            font-size: clamp(42px, 8vw, 82px);
            font-weight: 600;

            letter-spacing: 8px;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #d9d1ff 45%,
                    #8c75d9 100%
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 30px rgba(137, 104, 255, 0.3);
        }

        .line {
            width: 280px;
            max-width: 70%;

            height: 1px;

            margin: 25px auto 35px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #8d76ff,
                    transparent
                );

            box-shadow:
                0 0 12px rgba(130, 100, 255, 0.7);
        }

        /* Надпись */

        .launch-text {
            font-size: 15px;
            letter-spacing: 4px;

            color: #aaa5c9;

            margin-bottom: 18px;

            text-transform: uppercase;
        }

        /* Таймер */

        #timer {
            font-family: 'Orbitron', sans-serif;

            font-size: clamp(45px, 10vw, 90px);

            font-weight: 500;

            letter-spacing: 5px;

            color: #f4f1ff;

            text-shadow:
                0 0 8px rgba(168, 145, 255, 0.8),
                0 0 25px rgba(111, 80, 255, 0.55),
                0 0 55px rgba(80, 50, 255, 0.25);

            margin: 10px 0 30px;

            transition: all 0.3s ease;
        }

        /* Подпись */

        .local-time {
            font-size: 12px;
            letter-spacing: 2px;

            color: #706b8d;
        }

        /* Нижняя декоративная линия */

        .rune-line {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 15px;

            margin-top: 35px;

            color: #7561c8;
            opacity: 0.8;
        }

        .rune-line::before,
        .rune-line::after {
            content: "";

            width: 100px;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #7561c8
                );
        }

        .rune-line::after {
            background:
                linear-gradient(
                    90deg,
                    #7561c8,
                    transparent
                );
        }

        .rune {
            font-size: 18px;

            text-shadow:
                0 0 12px #765aff;

            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 0.5;
                transform: scale(0.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        /* Звёздная пыль */

        .stars {
            position: fixed;
            inset: 0;

            pointer-events: none;

            background-image:
                radial-gradient(
                    1px 1px at 20% 30%,
                    rgba(255,255,255,.6),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 70% 20%,
                    rgba(190,170,255,.7),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 80% 70%,
                    rgba(255,255,255,.5),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 30% 80%,
                    rgba(170,150,255,.6),
                    transparent
                ),
                radial-gradient(
                    1px 1px at 55% 55%,
                    rgba(255,255,255,.4),
                    transparent
                );

            opacity: 0.7;
        }

        /* Мобильная версия */

        @media (max-width: 600px) {

            .container {
                padding: 40px 20px;
            }

            h1 {
                letter-spacing: 4px;
            }

            #timer {
                letter-spacing: 2px;
            }

            .subtitle {
                letter-spacing: 3px;
            }

            .launch-text {
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>

    <div class="stars"></div>

    <main class="container">

        <div class="subtitle">
            The world awaits
        </div>

        <h1>AION II</h1>

        <div class="line"></div>

        <div class="launch-text">
            До открытия серверов
        </div>

        <div id="timer">
            00:00:00
        </div>

        <div class="local-time">
            Завтра • 16:00 • по вашему локальному времени
        </div>

        <div class="rune-line">
            <span class="rune">✦</span>
        </div>

    </main>

    <script>
        // ==========================================
        // ВРЕМЯ ЗАПУСКА
        // ==========================================

        const targetDate = new Date();

        // Завтра
        targetDate.setDate(targetDate.getDate() + 1);

        // 16:00 по локальному времени устройства
        targetDate.setHours(16, 0, 0, 0);


        // ==========================================
        // ТАЙМЕР
        // ==========================================

        const timer = document.getElementById("timer");

        function pad(number) {
            return String(number).padStart(2, "0");
        }

        function updateTimer() {

            const now = new Date();

            const distance = targetDate.getTime() - now.getTime();

            // Время вышло
            if (distance <= 0) {

                timer.textContent = "00:00:00";

                document.querySelector(".launch-text").textContent =
                    "Серверы открыты";

                timer.style.color = "#b9a5ff";

                return;
            }

            // Полные часы
            const hours = Math.floor(
                distance / (1000 * 60 * 60)
            );

            // Минуты
            const minutes = Math.floor(
                (distance % (1000 * 60 * 60)) /
                (1000 * 60)
            );

            // Секунды
            const seconds = Math.floor(
                (distance % (1000 * 60)) /
                1000
            );

            timer.textContent =
                `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }


        // Первый запуск
        updateTimer();

        // Обновление каждую секунду
        setInterval(updateTimer, 1000);

    </script>

</body>
</html>
